name: Daily data

on:
  schedule:
    # 11:00 UTC = 16:30 IST, after NSE closes at 15:30 IST, Monday to Friday
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt

      - name: Run daily pipeline
        working-directory: data-pipeline
        run: python -m pipeline.run_daily

      - name: Commit updated data
        run: |
          git config user.name "stock-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily data update"
            git push
          fi
